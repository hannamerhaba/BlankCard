<style>
:root{--bg:#E9ECF6;--app:#FFFFFF;--sheet:#FFFFFF;--sheet-row:#F1F3FA;--ap-bg:#F2F2F7;--ap-row:#FFFFFF;--ap-text:#000000;--ap-muted:#6C6C70;--ap-btn:#000000;--ap-btn-ink:#FFFFFF;--surface:#F3F4FA;--text:#141A3C;--muted:#5A628C;--border:#DADEEE;--accent:#2B3BD9;--accent-ink:#FFFFFF;--accent-bg:#E4E8FF;--good:#14764A;--good-bg:#DDF2E7;--warn:#8F5600;--warn-bg:#FFEFD0;--bad:#B3261E;--bad-bg:#FBE2E0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0E24;--app:#12163A;--sheet:#222965;--sheet-row:#2E3680;--ap-bg:#1C1C1E;--ap-row:#2C2C2E;--ap-text:#FFFFFF;--ap-muted:#98989D;--ap-btn:#FFFFFF;--ap-btn-ink:#000000;--surface:#1B2050;--text:#EDEFFF;--muted:#9BA3D2;--border:#2B3170;--accent:#8793FF;--accent-ink:#0B0E24;--accent-bg:#252C70;--good:#62D69C;--good-bg:#12392A;--warn:#F5C26B;--warn-bg:#3B2C0D;--bad:#FF8F86;--bad-bg:#3E1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0E24;--app:#12163A;--sheet:#222965;--sheet-row:#2E3680;--ap-bg:#1C1C1E;--ap-row:#2C2C2E;--ap-text:#FFFFFF;--ap-muted:#98989D;--ap-btn:#FFFFFF;--ap-btn-ink:#000000;--surface:#1B2050;--text:#EDEFFF;--muted:#9BA3D2;--border:#2B3170;--accent:#8793FF;--accent-ink:#0B0E24;--accent-bg:#252C70;--good:#62D69C;--good-bg:#12392A;--warn:#F5C26B;--warn-bg:#3B2C0D;--bad:#FF8F86;--bad-bg:#3E1714;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;max-width:420px;height:100%;max-height:860px;background:var(--app);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){.app{border-radius:28px;border:1px solid var(--border);box-shadow:0 18px 50px rgba(20,26,60,.18)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.brand{display:flex;align-items:center;font-size:17px;letter-spacing:.2px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.tag{font-size:11px;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:99px}
.view{flex:1;overflow-y:auto;padding:4px 18px 20px}
.view,.sheetbody{scrollbar-width:thin;scrollbar-color:transparent transparent}
.view.scrolling,.sheetbody.scrolling{scrollbar-color:rgba(90,98,140,.55) transparent}
.view::-webkit-scrollbar,.sheetbody::-webkit-scrollbar{width:6px}
.view::-webkit-scrollbar-thumb,.sheetbody::-webkit-scrollbar-thumb{background:transparent;border-radius:99px}
.view.scrolling::-webkit-scrollbar-thumb,.sheetbody.scrolling::-webkit-scrollbar-thumb{background:rgba(90,98,140,.55)}
.view h2{font-size:20px;margin:8px 0 2px}
.view h3{font-size:15px;margin:18px 0 8px}
.tabs{display:flex;border-top:1px solid var(--border);background:var(--app);padding:6px 6px 8px}
.tab{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;border-radius:12px}
.tab.on{color:var(--accent);font-weight:600}
.s{font-size:12px;color:var(--muted)}
.k{font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--muted);font-weight:400;font-size:13px}
.big{font-size:26px;font-weight:700;letter-spacing:-.3px}
.v{font-size:17px;font-weight:600}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin:10px 0}
.visual{position:relative;overflow:hidden;margin:8px 0;border-radius:20px;padding:18px;color:#141A3C;background:radial-gradient(120% 90% at 100% 0%,rgba(43,59,217,.16),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(242,177,52,.32),transparent 55%),linear-gradient(145deg,#FFFFFF,#EEF1FA 60%,#E2E6F4);border:1px solid #D7DBEE;box-shadow:0 12px 30px rgba(20,26,60,.14),inset 0 1px 0 #fff;aspect-ratio:1.8/1;display:flex;flex-direction:column;justify-content:space-between}
.visual::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.8) 48%,transparent 62%);pointer-events:none}
.visual>*{position:relative;z-index:1}
.visual .wm{font-size:20px;font-weight:600;letter-spacing:.2px}
.visual .chipimg{width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#F9DC9A,#E1A12A);border:1px solid rgba(20,26,60,.12)}
.visual .num{font-size:17px;letter-spacing:3px;font-weight:600}
.visual .tl{font-size:12px;color:#4C547E}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:#E3A008}
.bar.bad>i{background:var(--bad)}
.bar.good>i{background:var(--good)}
.bar.seg{display:flex}
.bar.seg>i{border-radius:0;background:var(--c)}
.bar.seg>i.ex{opacity:.38}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border:1px solid transparent;background:var(--accent-bg);color:var(--accent);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
button.chip{cursor:pointer;background:var(--surface);color:var(--text);border-color:var(--border)}
button.chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 14px;font-weight:600;width:100%}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--border);margin-top:8px}
.ic{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--app)}
.fb{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border)}
.fb:first-of-type{border-top:0}
.n{width:22px;height:22px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sp{flex:1}
.tx{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:none;padding:10px 0}
.tx:first-of-type{border-top:0}
.txl{display:flex;flex-direction:column;min-width:0}
.txr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.res{border-radius:12px;padding:10px 12px;margin-top:10px}
.res.ok{background:var(--app);color:var(--text);border:1px solid var(--border)}
.res.bad{background:var(--bad-bg);color:var(--bad)}
.res .s{color:inherit;opacity:.85}
.banner{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px}
.banner button{margin-left:auto;border:0;background:none;color:inherit;font-size:16px;line-height:1}
select,input[type=number],input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--app);border:1px solid var(--border);border-radius:10px;padding:9px 10px}
input[type=range]{width:100%;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:8px 0}
.log{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:92%;padding:9px 12px;border-radius:14px;font-size:13px}
.msg.bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.msg .chips{margin-top:8px}
.msg .btn{margin-top:8px;padding:8px 10px;font-size:13px}
.bars{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.bars div{display:grid;grid-template-columns:92px 1fr 52px;gap:6px;align-items:center;font-size:12px}
.bars i{display:block;height:8px;border-radius:99px;background:var(--accent)}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow button{width:auto;padding:0 14px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--sheet-row);border-radius:12px;padding:10px 12px;margin:6px 0}
.opt span{display:flex;flex-direction:column}
.lvl{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--border);background:var(--app);border-radius:12px;padding:11px 12px;margin:6px 0}
.lvl.on{border-color:var(--accent);background:var(--accent-bg)}
.lvl i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);margin-top:2px;flex:none}
.lvl.on i{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.lock{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:13px}
.soon{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
.note{background:var(--surface);border-radius:10px;padding:9px 11px;margin:8px 0;font-size:13px}
.sheet{position:absolute;inset:0;display:flex;align-items:flex-end;z-index:5}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(4,6,22,.66)}
.sheetbody{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:14px 18px 22px;border-top:1px solid var(--border);box-shadow:0 -14px 36px rgba(2,4,20,.45)}
.sheetbody::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 14px}
.sheetbody .note{background:var(--sheet-row)}
.sheetbody button.chip{background:var(--sheet-row)}
.sheetbody button.chip.on{background:var(--accent-bg)}
.sheetbody .btn.ghost{background:transparent}
.sheetbody h3{margin:0 0 6px;font-size:17px}
.bank{object-fit:contain;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;font-weight:700;font-size:14px;flex:none}
.prio{margin:8px 0;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.stack{display:flex;align-items:center;padding:8px 0 4px;overflow:visible}
.mini{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:84px;height:56px;border-radius:11px;padding:6px 8px;box-shadow:0 2px 6px rgba(20,26,60,.28);border:2px solid var(--app);flex:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .15s ease}
.mini.drag{cursor:grabbing;transition:none;box-shadow:0 8px 18px rgba(20,26,60,.4)}
.mini+.mini{margin-left:calc(-1 * var(--ov, 8px))}
.mini .mt{display:flex;justify-content:space-between;align-items:center}
.mini em.img{padding:0;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.mini em img{width:100%;height:100%;display:block}
.mini em{font-style:normal;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mini b{font-size:11px;line-height:1.1;font-weight:700;white-space:nowrap}
.mini i{font-style:normal;font-size:12px;font-weight:700}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:10px 0}
.acc .s{display:block}
.ic.gear{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.goalbtn{display:inline-flex;align-items:center;gap:5px;border:0;border-bottom:1px dashed var(--muted);background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:400;padding:0 0 1px;margin-left:4px;cursor:pointer}
.hrow{position:relative;display:flex;align-items:center;gap:6px}
.tip{display:inline-flex;align-items:center;color:var(--muted);cursor:help;outline:none;font-weight:400}
.tip:focus-visible,.tip.open{color:var(--accent)}
.tipbox{display:none;position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:6;flex-direction:column;gap:5px;background:var(--text);color:var(--app);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:400;line-height:1.45;box-shadow:0 8px 24px rgba(10,12,40,.3);cursor:default}
.tipbox .tr{display:flex;justify-content:space-between;gap:10px}
.tip:focus-visible .tipbox,.tip.open .tipbox{display:flex}
@media (hover:hover){.tip:hover .tipbox{display:flex}.tip:hover{color:var(--accent)}}
.accbody{padding:2px 0 8px}
.wallet{position:relative;margin:14px 0 6px}
.wcard{position:absolute;left:0;right:0;aspect-ratio:1.586/1;border-radius:18px;overflow:hidden;box-shadow:0 -2px 12px rgba(20,26,60,.18);cursor:grab;transition:transform .15s ease;border:1px solid rgba(20,26,60,.08);user-select:none;-webkit-user-select:none;touch-action:none}
.wcard.drag{transition:none;cursor:grabbing;box-shadow:0 14px 30px rgba(20,26,60,.32)}
.wfb{position:absolute;left:14px;top:12px}
.wctl{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border-radius:14px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#141A3C;box-shadow:0 1px 4px rgba(20,26,60,.16)}
.wbud{display:flex;flex-direction:column;gap:5px;min-width:78px}
.wbud b{font-size:14px;line-height:1.1;white-space:nowrap}
.wedit{width:34px;height:34px;border-radius:10px;border:0;background:rgba(20,26,60,.07);color:#141A3C;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.wgbar{display:block;height:3px;border-radius:99px;background:rgba(20,26,60,.12);overflow:hidden}
.wgbar u{display:block;height:100%;background:#141A3C;opacity:.65;text-decoration:none}
.eh{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:6px}
.ebig{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 0 6px}
.chip.lent{opacity:.55}

.bank.sm{width:28px;height:28px;border-radius:9px;font-size:11px}
.copt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--sheet-row);border-radius:14px;padding:12px;margin:8px 0;font-size:14px}
.copt .cn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.copt .amt{font-weight:700}
.copt.cur{background:var(--accent-bg);border-color:var(--accent)}
.copt:disabled{cursor:default}
.copt:disabled:not(.cur){opacity:.55}
.rdot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;flex:none}
.chev{color:var(--muted);font-size:20px;line-height:1;display:inline-flex;align-items:center}
.txl{flex:1}
.bar.thin{height:5px;margin-top:10px}
.chip.mc{font-size:11px;padding:2px 9px}
.crow{padding-top:12px;padding-bottom:14px}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;font-weight:600;padding:2px 0 0;cursor:pointer}
.textlink{display:block;border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:14px 0 6px;cursor:pointer}
.gnums{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 8px}
.gbig{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.gbig.m{color:var(--muted)}
.msg.wide{max-width:100%;width:100%;padding:14px}
.dg{display:flex;flex-direction:column;gap:14px}
.dgh{display:flex;justify-content:space-between;align-items:baseline}
.dgh b{font-size:16px}
.dgd{display:flex;justify-content:center}
.dgdonut{width:132px;height:132px}
.dgbars{display:flex;gap:6px;align-items:flex-end}
.dgcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.dgbar{position:relative;height:72px;width:100%;display:flex;align-items:flex-end}
.dgbar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.35}
.dgbar i.now{opacity:1}
.dgr{display:flex;gap:10px;align-items:flex-start}
.dgi{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.dgm{flex:1;min-width:0}
.dgp{height:5px;border-radius:99px;background:var(--border);margin:6px 0 3px;overflow:hidden}
.dgp i{display:block;height:100%;border-radius:99px}
.dgc{font-size:11px;text-align:right;color:var(--muted)}
.dgc.up{color:var(--bad)}
.dgc.down{color:var(--good)}
.av{display:flex;flex-direction:column;gap:12px}
.abig{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.arow{display:flex;gap:10px;align-items:center}
.am{flex:1;min-width:0}
.apb{height:5px;border-radius:99px;background:var(--border);margin-top:5px;overflow:hidden}
.apb i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.apb i.warn{background:#E3A008}
.apb i.bad{background:var(--bad)}
.again{color:var(--good)}
.mvr{display:flex;align-items:center;gap:8px}
.mvp{flex:1;display:flex;align-items:center;gap:8px;background:var(--app);border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:0}
.mvp b{font-size:13px}
.mva{color:var(--muted);font-size:18px}
.apay{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end}
.apay[hidden]{display:none}
.apscrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.apsheet{position:relative;width:100%;background:var(--ap-bg);color:var(--ap-text);border-radius:22px 22px 0 0;padding:14px 16px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:apup .25s ease-out}
@keyframes apup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.aph{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px;min-height:30px}
.apt{font-size:17px;font-weight:600}
.apx{position:absolute;right:0;top:0;width:30px;height:30px;border-radius:50%;border:0;background:var(--ap-row);color:var(--ap-muted);font-size:20px;line-height:1;cursor:pointer}
.aplab{font-size:12px;color:var(--ap-muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 6px}
.aprow{display:flex;align-items:center;gap:12px;background:var(--ap-row);border-radius:14px;padding:12px 14px;font-size:15px;justify-content:space-between}
.aprow .apm{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.aprow .apm span{font-size:13px;color:var(--ap-muted)}
.apnote{font-size:12px;color:var(--ap-muted);margin:8px 4px 0}
.apcard{position:relative;width:58px;height:37px;border-radius:6px;background:linear-gradient(145deg,#fff,#dfe3f3);border:1px solid rgba(0,0,0,.14);flex:none;overflow:hidden}
.apcard em{position:absolute;left:5px;top:4px;font:700 6px/1 Inter,sans-serif;color:#141A3C;font-style:normal}
.apcard .apchip{position:absolute;left:6px;top:15px;width:10px;height:8px;border-radius:2px;background:#d9b26a}
.apcard img{position:absolute;right:4px;bottom:4px;height:8px;width:auto}
.apbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;height:52px;border-radius:14px;border:0;background:var(--ap-btn);color:var(--ap-btn-ink);font:600 17px Inter,sans-serif;cursor:pointer}
.apbtn.ghost{background:var(--ap-row);color:var(--ap-text);margin-top:10px}
.apfid{display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px 0 4px;font-size:14px}
.apfid svg{animation:appulse 1s ease-in-out infinite}
@keyframes appulse{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
.apdone{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 4px;font-size:18px;font-weight:600}
.apdone.bad{color:var(--bad)}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:10px;flex:none}
.tab{position:relative}
.tab.alert::after{content:"";position:absolute;top:5px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--app)}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0;min-height:46px}
.iconbtn{border:0;background:none;color:var(--muted);min-width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600}
.brand2{display:inline-flex;align-items:center;gap:10px;font-size:16px;color:var(--text)}
.vlogo{height:15px;width:auto;display:block;background:#fff;border-radius:5px;padding:4px 7px;box-sizing:content-box}
.bdiv{width:1px;height:18px;background:var(--border)}
.visual .visa{height:24px;width:auto;display:block}
.iconbtn.back{color:var(--accent);padding:0 8px 0 4px;font-size:15px}
.panel .lock:first-child{border-top:0}
.duebtn{display:block;border:0;background:none;padding:0;font:inherit;font-size:12px;font-weight:600;color:var(--bad);text-align:left;cursor:pointer}
.donutrow{display:flex;align-items:center;gap:16px;margin-top:8px}
.donut{position:relative;width:120px;height:120px;flex:none}
.donut svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dc b{font-size:21px;line-height:1.1;letter-spacing:-.3px}
.dcol{display:flex;flex-direction:column;align-items:center;flex:none}
.tiles{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.tile{display:flex;align-items:center;gap:11px}
.ib{position:relative;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.ib .bgl{position:absolute;inset:0;display:block}
.ib svg{position:relative}
.dsign{position:relative;font-size:20px;font-weight:700;line-height:1}
.tt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.tt .s{font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.tt b{font-size:18px;letter-spacing:-.2px}
.duehead{display:flex;align-items:center;gap:8px}
.duehead .s{font-size:12px}
.duehead button.chip.bad,.duehead button.chip.ok{margin-top:0}
button.chip.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.chip.iconchip{width:30px;height:30px;padding:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.row2{display:flex;align-items:center;gap:7px}
.row2 b{margin-left:auto}
.dd{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.pill.good{background:var(--accent-bg);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.due{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13px}
.due:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:10px}
button.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);margin-top:6px}
.linkpanel{display:block;width:100%;text-align:left;color:var(--text);font:inherit}
.toast{position:absolute;left:16px;right:16px;top:14px;background:var(--text);color:var(--app);border-radius:12px;padding:10px 12px;font-size:13px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s;z-index:9}
.toast.show{opacity:1;transform:none}
</style>
</head>

function byId(id){return cards.filter(function(c){return c.id===id})[0]||removed.filter(function(c){return c.id===id})[0]}
function spent(id){return txns.filter(function(t){return t.card===id}).reduce(function(a,t){return a+t.amt},0)}
function rem(c){return c.budget-spent(c.id)}
function bal(c){return c.balance-txns.filter(function(t){return t.card===c.id&&t.id>12}).reduce(function(a,t){return a+t.amt},0)}
function rate(c,cat){if(c.offer&&c.offer.cat===cat)return c.offer.rate;return c.rates[cat]!==undefined?c.rates[cat]:c.base}
function earned(t){return t.amt*rate(byId(t.card),t.cat)/100}
function totalSpent(){return txns.reduce(function(a,t){return a+t.amt},0)}
function totalEarned(){return txns.reduce(function(a,t){return a+earned(t)},0)}
function ownerOf(cat){return cards.filter(function(c){return c.cats.indexOf(cat)>-1})[0]}
txns.forEach(function(t){t.reason='Rule: '+t.cat+' → '+byId(t.card).name});

function route(cat,amt){
  var o=ownerOf(cat);
  if(o&&rem(o)>=amt)return {card:o,reason:'Rule: '+cat+' → '+o.name};
  for(var i=0;i<order.length;i++){var c=byId(order[i]);if(rem(c)>=amt)return {card:c,reason:o?o.name+' budget reached, so priority '+(i+1)+' pays':'No rule for '+cat+', so priority '+(i+1)+' pays'}}
  return {card:null,reason:'All card budgets reached'};
}

var savings=800;
var guard={mode:'suggest',buffer:100,cap:300,src:{B:true,S:true}};
var glog=[{t:'Yesterday 02:00',x:'Nightly check: all repayments covered'}];
var pending=null,gOpen=false,sOpen={p:false,m:false},gWhy=false,showEarlier=false,prevTab='home';
var DUES=[{name:'HSBC repayment',card:'C',date:'Nov 8',day:4},{name:'Electric bill',amt:120,date:'Nov 10',day:6},{name:'Costco repayment',card:'D',date:'Nov 12',day:8}];
function dues(){return DUES.filter(function(d){return !d.card||cards.some(function(c){return c.id===d.card})}).map(function(d){return {name:d.name,date:d.date,day:d.day,amt:d.card?spent(d.card):d.amt}})}
function srcBal(id){return id==='S'?savings:bal(byId(id))}
function srcName(id){return id==='S'?'Barclays Savings':byId(id).name.replace(' Debit Card','')+' account'}
function forecast(){
  var a=bal(byId('A')),b=a,rows=[],total=0;
  dues().forEach(function(d){b-=d.amt;total+=d.amt;rows.push({name:d.name,date:d.date,day:d.day,amt:d.amt,after:b})});
  var first=rows.filter(function(r){return r.after<guard.buffer})[0];
  return {a:a,rows:rows,total:total,short:Math.max(0,total+guard.buffer-a),first:first};
}
function plan(){
  var f=forecast();if(f.short<=0)return {f:f,amt:0,src:null};
  var need=Math.ceil(f.short/10)*10,amt=Math.min(need,guard.cap);
  var ok=['B','S'].filter(function(id){return guard.src[id]&&srcBal(id)>=amt});
  return {f:f,need:need,amt:amt,src:ok[0]||null,capped:need>guard.cap};
}
function doTransfer(p,who){
  if(!p.src||p.amt<=0)return false;
  if(p.src==='S')savings-=p.amt;else byId(p.src).balance-=p.amt;
  byId('A').balance+=p.amt;
  glog.unshift({t:'Just now',x:who+': moved '+fmt(p.amt)+' from '+srcName(p.src)+' to Barclays current account'});
  return true;
}
function gstate(){var f=forecast();if(f.short<=0)return ['good','All repayments covered'];return f.rows.some(function(r){return r.after<0})?['bad','Overdraft risk']:['warn','Needs a top-up']}
function nightly(){
  var p=plan(),f=p.f;
  if(f.short<=0){glog.unshift({t:'Just now',x:'Nightly check: all repayments covered'});toast('All repayments covered');return}
  if(guard.mode==='alert'){glog.unshift({t:'Just now',x:'Alert sent: '+fmt(f.short)+' short for upcoming repayments'});alerts.push('Repayment Guard: your Barclays account will be '+fmt(f.short)+' short for upcoming repayments.');toast('Alert sent');return}
  if(guard.mode==='suggest'){glog.unshift({t:'Just now',x:'Suggested a '+fmt(p.amt)+' top-up. Waiting for your approval'});toast('Top-up suggested. Approve it in Guard');return}
  if(doTransfer(p,'Auto top-up')){var left=forecast().short;toast('Moved '+fmt(p.amt)+' to Barclays');if(left>0)alerts.push('Repayment Guard moved '+fmt(p.amt)+', your per-transfer cap. You are still '+fmt(left)+' short.')}
  else{glog.unshift({t:'Just now',x:'Could not top up: no allowed account has enough money'});alerts.push('Repayment Guard could not top up: no allowed account has '+fmt(p.amt)+'.')}
}
function guardReact(){
  var f=forecast();if(f.short<=0)return;
  if(guard.mode==='auto')nightly();

  var d=new Date(t.ts),n=new Date(),y=new Date(n.getTime());y.setDate(n.getDate()-1);
  var tm=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===n.toDateString())return tm;
  if(d.toDateString()===y.toDateString())return 'Yesterday '+tm;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+tm;
}
function betterFor(t){
  if(t.h>=24)return null;
  var curR=earned(t),best=null;
  cards.forEach(function(c){
    if(c.id===t.card||rem(c)<t.amt)return;
    var r=t.amt*rate(c,t.cat)/100,g=r-curR;
    if(g>=0.25&&(!best||g>best.gain))best={card:c,gain:g};
  });
  return best;
}

function bestMove(){

  Object.keys(cs).forEach(function(cat){
    var o=ownerOf(cat),cur=o?rate(o,cat):rate(byId(order[0]),cat);
    cards.forEach(function(c){

      var r=rate(c,cat);

    });
  });

}

    case 'dismiss':alerts.splice(+el.dataset.i,1);render();break;
    case 'openTx':openSheet(txSheet(+id));break;
    case 'switchTx':var t=txns.filter(function(x){return x.id===+id})[0];t.card=el.dataset.card;t.reason='Edited by you within 24 hours';closeSheet();toast('Moved to '+byId(t.card).name+' · reward '+fmt(earned(t),2));render();break;
    case 'sheetClose':closeSheet();break;
    case 'up':var i=order.indexOf(id);if(i>0){order.splice(i-1,0,order.splice(i,1)[0]);render();if(edit)$('#sheetBody').innerHTML=editSheet()}break;
    case 'down':var j=order.indexOf(id);if(j<order.length-1){order.splice(j+1,0,order.splice(j,1)[0]);render();if(edit)$('#sheetBody').innerHTML=editSheet()}break;
    case 'editCard':var c=byId(id);edit={id:id,budget:c.budget,cats:c.cats.slice(),moved:[]};openSheet(editSheet());break;
    case 'ecat':var cat=el.dataset.cat,k=edit.cats.indexOf(cat);if(k>-1)edit.cats.splice(k,1);else{edit.cats.push(cat);edit.moved.push(cat)}$('#sheetBody').innerHTML=editSheet();break;
    case 'saveCard':var cc=byId(edit.id);cc.budget=edit.budget;cards.forEach(function(o){if(o.id!==cc.id)o.cats=o.cats.filter(function(x){return edit.cats.indexOf(x)<0})});cc.cats=edit.cats.slice();closeSheet();toast('Rules saved for '+cc.name);render();break;
    case 'linkStart':link={issuer:null};openSheet(linkSheet());break;
    case 'linkPick':link.issuer=id;$('#sheetBody').innerHTML=linkSheet();break;
    case 'linkAuth':var p=pool.filter(function(x){return x.id===link.issuer})[0];pool=pool.filter(function(x){return x!==p});var rs=removed.filter(function(x){return x.id===p.id})[0];if(rs){rs.cats=[];cards.push(rs);removed=removed.filter(function(x){return x!==rs})}else{cards.push({id:p.id,name:p.name,kind:p.kind,issuer:p.issuer,budget:200,balance:p.balance,cats:[],rates:{},base:p.base})}order.push(p.id);toast(p.name+' linked');render();openSheet(manageSheet());break;
    case 'revoke':var rc=byId(id);openSheet('<h3>Remove '+rc.name+'?</h3><div class="s">BlankCard stops reading this card and routing payments to it. Its categories move to your priority order. Past payments stay in your history.</div><button class="btn" style="margin-top:14px;background:var(--bad)" data-act="revokeOk" data-id="'+id+'">Remove card</button><button class="btn ghost" data-act="manage">Cancel</button>');break;
    case 'revokeOk':var rm=byId(id);cards=cards.filter(function(x){return x.id!==id});order=order.filter(function(x){return x!==id});removed.push(rm);pool.push({id:rm.id,name:rm.name,kind:rm.kind,issuer:rm.issuer,balance:rm.balance,base:rm.base});if(guard.src[id])guard.src[id]=false;toast(rm.name+' removed');render();openSheet(manageSheet());break;
    case 'setLevel':lvl=+el.dataset.i;render();toast('AI authorization updated');break;
    case 'quick':quick(el.dataset.q);render();break;
    case 'askRules':replyRules(id);render();break;
    case 'raise':byId(id).budget=+el.dataset.v;me('Raise budget');say('Budget raised to '+fmt(byId(id).budget)+'.');render();break;
    case 'apply':me('Apply');snap();applyMove(el.dataset.cat,el.dataset.to);say('<div class="s"><b>Applied</b> · '+el.dataset.cat+' → '+cshort(byId(el.dataset.to))+'</div><button class="btn" data-act="undo">Undo</button>');render();break;
    case 'undo':undo();me('Undo');say('Undone.');render();break;
    case 'setGoalQuick':goal=+el.dataset.v;me(fmt(goal));say('Goal set to '+fmt(goal)+' · you’re at '+Math.round(totalSpent()/goal*100)+'%.');render();break;
    case 'send':send();break;
    case 'gNightly':nightly();render();break;
    case 'gApprove':var pp=plan();stepUp('Approve transfer','Move '+fmt(pp.amt)+' from '+srcName(pp.src)+' to your Barclays current account?',function(){var q=plan();if(doTransfer(q,'You approved'))toast('Moved '+fmt(q.amt)+' to Barclays')});break;
    case 'gMode':var mi=+el.dataset.i,modes=['alert','suggest','auto'];if(modes[mi]==='auto'&&guard.mode!=='auto'){stepUp('Turn on auto top-up','BlankCard will move money between your accounts by itself, inside the limits you set.',function(){guard.mode='auto'})}else{guard.mode=modes[mi];guardReact();render()}break;
    case 'gBuf':guard.buffer=Math.max(0,guard.buffer+Number(el.dataset.d));guardReact();render();break;
    case 'gCap':var gd=Number(el.dataset.d);if(gd>0){stepUp('Raise the transfer cap','Allow up to '+fmt(guard.cap+gd)+' per transfer?',function(){guard.cap+=gd})}else{guard.cap=Math.max(50,guard.cap+gd);guardReact();render()}break;
    case 'gsrc':var sid=el.dataset.id;if(!guard.src[sid]){stepUp('Allow '+srcName(sid),'Let Repayment Guard take money from '+srcName(sid)+'?',function(){guard.src[sid]=true})}else{guard.src[sid]=false;render()}break;
    case 'stepOk':var sfn=pending;pending=null;closeSheet();if(sfn)sfn();guardReact();render();break;
    case 'goalEdit':openSheet(goalSheet());break;
    case 'goalPick':var gi=$('#goalin');if(gi)gi.value=el.dataset.v;break;
    case 'goalSave':saveGoal();break;
    case 'sToggle':sOpen[el.dataset.k]=!sOpen[el.dataset.k];render();break;
    case 'gotoMoney':sOpen.m=true;if(tab!=='settings')prevTab=tab;tab='settings';closeSheet();render();break;
    case 'gotoPay':sOpen.p=true;if(tab!=='settings')prevTab=tab;tab='settings';closeSheet();render();break;
    case 'manage':openSheet(manageSheet());break;
    case 'back':tab=prevTab||'home';closeSheet();render();break;
    case 'gWhy':gWhy=!gWhy;render();break;
    case 'toggleEarlier':showEarlier=!showEarlier;render();break;
    case 'tipToggle':el.classList.toggle('open');break;
    case 'gToggle':gOpen=!gOpen;render();break;
    case 'reset':location.reload();break;
  }
});
document.addEventListener('input',function(e){
  var k=e.target.dataset.in;if(!k)return;
  if(k==='sima')simA=e.target.value;
  else if(k==='ebudget'&&edit){edit.budget=+e.target.value;$('#eb').textContent=fmt(edit.budget)}
});
document.addEventListener('change',function(e){
  if(e.target.dataset.in==='simm'){simI=+e.target.value;simA=MERCH[simI].amt;render()}
});
document.addEventListener('scroll',function(e){
  var t=e.target;if(!t||!t.classList||!(t.classList.contains('view')||t.classList.contains('sheetbody')))return;
  t.classList.add('scrolling');clearTimeout(t._st);t._st=setTimeout(function(){t.classList.remove('scrolling')},900);
},true);
window.addEventListener('resize',fixWallet);
var drag=null,lastDrag=0;
document.addEventListener('pointerdown',function(e){
  if(tab!=='cards'||!e.target.closest)return;
  if(e.target.closest('.wedit'))return;
  var el=e.target.closest('.wcard');if(!el)return;
  var cs=[].slice.call(document.querySelectorAll('.wallet .wcard')),idx=cs.indexOf(el);if(idx<0)return;
  drag={el:el,cs:cs,idx:idx,y0:e.clientY,target:idx,active:false,pid:e.pointerId};
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dy=e.clientY-drag.y0,n=drag.cs.length;
  if(!drag.active){
    if(Math.abs(dy)<6)return;
    drag.active=true;drag.el.classList.add('drag');drag.el.style.zIndex=99;
    if(drag.el.setPointerCapture&&drag.pid!==undefined){try{drag.el.setPointerCapture(drag.pid)}catch(_){}}
  }
  drag.el.style.transform='translateY('+dy+'px)';
  var t=Math.max(0,Math.min(n-1,Math.round(drag.idx+dy/WSTEP)));
  drag.target=t;
  drag.cs.forEach(function(m,j){
    if(j===drag.idx)return;
    var s='';
    if(t>drag.idx&&j>drag.idx&&j<=t)s='translateY(-'+WSTEP+'px)';
    else if(t<drag.idx&&j<drag.idx&&j>=t)s='translateY('+WSTEP+'px)';
    m.style.transform=s;
  });
});
function endDrag(){
  if(!drag)return;
  var dd=drag;drag=null;
  if(!dd.active)return;
  lastDrag=Date.now();
  var n=dd.cs.length;
  if(dd.target!==dd.idx){var id=order.splice(dd.idx,1)[0];order.splice(dd.target,0,id)}
  render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('wcard')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.id==='goalin'){saveGoal();return}
  if(e.key==='Enter'&&e.target.id==='chatin')send()});
(function(){var p=plan();if(guard.mode==='auto'&&p.f.short>0)doTransfer(p,'Auto top-up')})();
render();
})();
</script>
</body>
</html>
